<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deuce's Double Double Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="topbar">
  <a class="brand" href="#/">
    <span class="brand-ball" aria-hidden="true"></span>
    <span class="brand-text">DEUCE'S <em>DOUBLE DOUBLE</em> PARTY</span>
  </a>
  <nav id="mainnav" aria-label="Party pages">
    <a href="#/">Invite</a>
    <a href="#/rsvp">RSVP</a>
    <a href="#/tickets">Tickets</a>
    <a href="#/check-in">Door</a>
    <a href="#/trivia">Trivia</a>
    <a href="#/booth">Booth</a>
    <a href="#/cards">Cards</a>
    <a href="#/recap">Recap</a>
    <a href="#/jumbotron" class="tv-link">Jumbotron</a>
    <a href="#/snack-tv" class="tv-link">Snack TV</a>
    <a href="#/admin" class="admin-link">Admin</a>
  </nav>
  <nav id="hubnav" aria-label="Back to the Jumbotron hub" hidden>
    <a href="#/" class="hub-back">&larr; Jumbotron Hub</a>
    <span id="hub-title"></span>
  </nav>
</header>

<main id="app" aria-live="polite"></main>

<footer id="sitefoot">
  <div class="stat-line">DEUCE #10 — 10 PTS · 10 REB · 10x FUN</div>
  <div class="foot-sub">Saturday, December 19, 2026 · 4:00 PM · At Deuce's House — El Mirage, AZ</div>
</footer>

<!-- Print-only area (filled by app.js before window.print) -->
<div id="print-area" aria-hidden="true"></div>

<!-- Libraries (CDN). The app feature-detects each one and degrades gracefully offline. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
